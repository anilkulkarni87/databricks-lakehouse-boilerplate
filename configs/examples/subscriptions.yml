version: "1.0"
entity_name: "subscriptions"
description: "SaaS subscription lifecycle events with automated billing contact PII separation"
business_domain: "Subscriptions & Revenue"

source:
  catalog: "raw_landing"
  schema: "event_stream"
  table: "silver_subscription_events"
  stream_filter_field: null
  payload_column: "payload"
  # Phase 3: Databricks Native Binary VARIANT for 8-10x faster sub-column queries
  payload_type: "variant"

runtime:
  trigger_type: "AvailableNow"
  max_mbytes_per_trigger: 2000
  checkpoint_location: "dbfs:/checkpoints/lakehouse_engine/subscriptions"
  audit_table: "saas_dw.operational_telemetry.batch_audit_log"

# Non-PII Gold Curated Table
gold:
  catalog: "saas_dw"
  schema: "subscription_analytics"
  table: "dim_subscriptions"
  table_comment: "Curated SaaS subscription dimension. Grain: one row per active/historical subscription entity. Non-PII analytics safe."
  table_type: "dimension"
  unique_keys: ["subscription_id"]
  cluster_by: ["started_at"]
  prune_column: "started_at"
  schema_evolution: "mergeSchema"

  # Phase 1 & 3: Dead-Letter Queue & VARIANT Rescued Data
  enable_dlq: true
  dlq_table: "saas_dw.subscription_analytics.dim_subscriptions_dlq"
  track_rescued_data: true
  store_rescued_as_variant: true

  # Phase 2: Declarative Data Quality Expectations
  expectations:
    - name: "valid_mrr_non_negative"
      expr: "mrr_amount >= 0.0"
      action: "fail_batch"
      description: "Circuit breaker: Monthly Recurring Revenue cannot be negative."
    - name: "valid_subscription_status"
      expr: "status IN ('ACTIVE', 'PAST_DUE', 'CANCELLED', 'PAUSED')"
      action: "quarantine"
      description: "Unrecognized lifecycle status strings are quarantined to DLQ."
    - name: "non_future_started_timestamp"
      expr: "started_at <= current_timestamp()"
      action: "warn"
      description: "Logs warning if contract started_at is post-dated."

  # Kimball Dimensional Modeling & Genie Semantic Relationships
  foreign_keys:
    - column: "subscriber_account_id"
      referenced_table: "saas_dw.subscription_analytics_pii.dim_subscriber_profiles"
      referenced_column: "subscriber_account_id"
      relationship_description: "Joins to customer PII outrigger profile table for authorized identity lookups."

  # Official Business Metrics for Genie Text-to-SQL
  metrics:
    - name: "Total MRR"
      sql_formula: "SUM(CASE WHEN status = 'ACTIVE' THEN mrr_amount ELSE 0 END)"
      description: "Total Monthly Recurring Revenue from active paying subscriptions in USD."
      synonyms: ["MRR", "Monthly Revenue", "Recurring Revenue"]
    - name: "Active Subscription Count"
      sql_formula: "COUNT(DISTINCT CASE WHEN status = 'ACTIVE' THEN subscription_id END)"
      description: "Count of unique currently active subscriptions."
      synonyms: ["Active Subs", "Paying Customers", "Subscriber Count"]
    - name: "Active Trial Count"
      sql_formula: "COUNT(DISTINCT CASE WHEN is_trial = true AND status = 'ACTIVE' THEN subscription_id END)"
      description: "Count of customers currently evaluating the product in a free trial."
      synonyms: ["Free Trials", "Trial Users"]

  fields:
    - name: "subscription_id"
      type: "string"
      expr: "payload.subscriptionId"
      description: "Unique natural primary identifier for the subscription contract."
      is_primary_key: true
    - name: "plan_tier"
      type: "string"
      expr: "payload.plan.tier"
      description: "Product tier associated with the subscription (e.g. Starter, Pro, Enterprise)."
    - name: "billing_interval"
      type: "string"
      expr: "payload.plan.billingInterval"
      description: "Billing cadence: monthly, quarterly, or annual."
    - name: "mrr_amount"
      type: "double"
      expr: "cast(payload.plan.amountCents as double) / 100.0"
      description: "Monthly Recurring Revenue normalized to USD dollars. Always use this column for revenue KPIs."
    - name: "currency"
      type: "string"
      expr: "payload.currency"
      description: "ISO three-letter billing currency code (e.g. USD, EUR, CAD)."
    - name: "status"
      type: "string"
      expr: "payload.status"
      description: "Current lifecycle status: ACTIVE, PAST_DUE, CANCELLED, or PAUSED."
    - name: "is_trial"
      type: "boolean"
      expr: "cast(payload.isTrial as boolean)"
      description: "Flag indicating whether the subscription is currently in a promotional zero-cost trial period."
    - name: "auto_renew"
      type: "boolean"
      expr: "cast(payload.autoRenew as boolean)"
      description: "True if the contract is configured to automatically renew at the end of the current billing cycle."
    - name: "renewal_count"
      type: "int"
      expr: "cast(payload.renewalCount as int)"
      description: "Cumulative number of times this subscription has successfully renewed."
    - name: "started_at"
      type: "timestamp"
      expr: "cast(payload.startedOn as timestamp)"
      description: "Timestamp when the subscription contract was originally initiated."
    - name: "updated_at"
      type: "timestamp"
      expr: "cast(payload.updatedOn as timestamp)"
      description: "Timestamp of the most recent status or tier modification."
    - name: "subscriber_account_id"
      type: "string"
      expr: "xxhash64(cast(payload.subscriberId as string))"
      description: "Deterministic 64-bit hash key linking to dim_subscriber_profiles in the secure PII schema."

# Automated PII Isolation
pii_splits:
  - name: "subscriber_profiles"
    target_catalog: "saas_dw"
    target_schema: "subscription_analytics_pii"
    target_table: "dim_subscriber_profiles"
    table_comment: "Restricted subscriber identity and PII profile dimension."
    unique_keys: ["subscriber_account_id"]
    foreign_key_expr: "xxhash64(cast(payload.subscriberId as string))"
    foreign_key_name: "subscriber_account_id"
    cluster_by: ["created_at"]
    fields:
      - name: "original_subscriber_id"
        type: "string"
        expr: "payload.subscriberId"
        description: "Raw upstream subscriber ID."
      - name: "subscriber_email"
        type: "string"
        expr: "payload.subscriber.email"
        description: "Subscriber primary contact email address. Protected by dynamic masking policy."
        mask_policy: "mask_email"
      - name: "billing_contact_name"
        type: "string"
        expr: "payload.subscriber.contactName"
        description: "Full name of the designated billing authority."
      - name: "billing_phone"
        type: "string"
        expr: "payload.subscriber.phone"
        description: "Direct contact phone number."
      - name: "company_tax_id"
        type: "string"
        expr: "payload.subscriber.taxIdentifier"
        description: "Corporate VAT/EIN tax identifier."
      - name: "billing_country"
        type: "string"
        expr: "payload.subscriber.country"
        description: "Two-letter ISO country code for tax jurisdiction."
      - name: "billing_postal_code"
        type: "string"
        expr: "payload.subscriber.postalCode"
        description: "Billing address postal / ZIP code."
      - name: "created_at"
        type: "timestamp"
        expr: "cast(payload.startedOn as timestamp)"
        description: "Profile creation timestamp."
