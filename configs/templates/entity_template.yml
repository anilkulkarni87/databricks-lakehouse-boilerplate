# ==============================================================================
# Entity Extraction & Lakehouse Ingestion Configuration Template
# ==============================================================================
version: "1.0"
entity_name: "example_entity"
description: "Template definition for ingesting an entity with automated PII segregation"

# Source Table Configuration (Silver layer or raw stream)
source:
  catalog: "raw_catalog"
  schema: "ingestion_stream"
  table: "silver_stream_payloads"
  stream_filter_field: "stream_name"
  stream_filter_value: "example_entity"

# Runtime Streaming Parameters
runtime:
  trigger_type: "AvailableNow" # AvailableNow for batch-like cost, ProcessingTime for 24/7 streaming
  max_mbytes_per_trigger: 2048 # Throttles batch size to prevent disk spill / memory pressure
  checkpoint_location: "dbfs:/checkpoints/lakehouse_engine/example_entity"
  audit_table: "enterprise_dw.operational_telemetry.batch_audit_log" # Centralized telemetry

# Non-PII Gold Destination Table
gold:
  catalog: "enterprise_dw"
  schema: "domain"
  table: "example_entities"
  table_comment: "Curated domain entity table. Non-PII analytics safe."
  table_type: "dimension"
  unique_keys: ["id"]
  cluster_by: ["created_at"]       # Databricks Liquid Clustering
  prune_column: "created_at"       # Prunes MERGE table scans to changed dates
  schema_evolution: "mergeSchema"  # Auto-evolves Delta table when new columns are declared
  
  # Phase 1: Dead-Letter Queue & Rescued Data
  enable_dlq: true
  dlq_table: "enterprise_dw.domain.example_entities_dlq"
  track_rescued_data: true

  # Phase 2: Declarative Data Quality Expectations
  expectations:
    - name: "valid_id_positive"
      expr: "id > 0"
      action: "fail_batch"
      description: "Circuit breaker: ID must be positive."
    - name: "valid_status"
      expr: "status IN ('ACTIVE', 'PENDING', 'ARCHIVED')"
      action: "quarantine"
      description: "Quarantine rows with unexpected status codes."

  fields:
    - name: "id"
      type: "bigint"
      expr: "cast(payload.id as bigint)"
      description: "Primary key identifier."
      is_primary_key: true
    - name: "reference_code"
      type: "string"
      expr: "payload.ref"
      description: "Human-readable reference code."
    - name: "status"
      type: "string"
      expr: "payload.status"
      description: "Current lifecycle state."
    - name: "created_at"
      type: "timestamp"
      expr: "cast(payload.createdOn as timestamp)"
      description: "Record creation timestamp."
    - name: "updated_at"
      type: "timestamp"
      expr: "cast(payload.updatedOn as timestamp)"
      description: "Most recent update timestamp."

# Optional: Automated PII Splits (routed to secure _pii schema / catalog)
pii_splits:
  - name: "pii_profile"
    target_catalog: "enterprise_dw"
    target_schema: "domain_pii"
    target_table: "example_entity_pii"
    table_comment: "Sensitive customer profile data. Requires PII access group permissions."
    unique_keys: ["entity_id"]
    foreign_key_expr: "cast(payload.id as bigint)"
    foreign_key_name: "entity_id"
    cluster_by: ["created_at"]
    fields:
      - name: "email"
        type: "string"
        expr: "payload.customerProfile.email"
        description: "Primary customer contact email."
        mask_policy: "mask_email" # Unity Catalog Column Mask UDF
      - name: "phone_number"
        type: "string"
        expr: "payload.customerProfile.phone"
        description: "Customer telephone contact."
      - name: "full_name"
        type: "string"
        expr: "payload.customerProfile.name"
        description: "Full personal legal name."
