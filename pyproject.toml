[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "lakehouse-engine"
version = "0.1.0"
description = "Declarative, metadata-driven Databricks Lakehouse ETL framework with automated PII segregation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Data Platform Team" }]
dependencies = [
    "pyspark>=3.5.0",
    "delta-spark>=3.2.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "chispa>=0.9.4",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
lakehouse-engine = "lakehouse_engine.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
