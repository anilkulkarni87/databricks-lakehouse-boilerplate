<!-- MathJax 3 for rendering LaTeX math formulas -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    options: {
      ignoreHtmlClass: 'tex2jax_ignore',
      processHtmlClass: 'tex2jax_process'
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- Mermaid.js integration for GitHub Pages -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  mermaid.initialize({
    startOnLoad: false,
    theme: 'default',
    securityLevel: 'loose'
  });

  async function renderMermaidCharts() {
    const codeBlocks = document.querySelectorAll(
      'pre code.language-mermaid, pre.language-mermaid, div.language-mermaid pre, code.language-mermaid'
    );

    if (codeBlocks.length === 0) return;

    codeBlocks.forEach((codeEl) => {
      const containerToReplace = codeEl.closest('.language-mermaid') || codeEl.closest('pre') || codeEl;
      const mermaidDiv = document.createElement('div');
      mermaidDiv.className = 'mermaid';
      mermaidDiv.textContent = codeEl.textContent.trim();
      containerToReplace.parentNode.replaceChild(mermaidDiv, containerToReplace);
    });

    await mermaid.run({
      querySelector: '.mermaid'
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderMermaidCharts);
  } else {
    renderMermaidCharts();
  }
</script>
<style>
  .mermaid {
    display: flex;
    justify-content: center;
    margin: 1.5rem 0;
    background: #f6f8fa;
    padding: 1.25rem;
    border-radius: 8px;
    border: 1px solid #d0d7de;
    overflow-x: auto;
  }
  .mermaid svg {
    max-width: 100%;
    height: auto;
  }
</style>
