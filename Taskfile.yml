version: '3'

env:
  PYTHONPATH: src

tasks:
  install:
    desc: Install Python dependencies
    cmds:
      - pip install -e ".[dev]"

  lint:
    desc: Run linting and static analysis
    cmds:
      - ruff check src/ tests/
      - mypy src/

  format:
    desc: Format code with ruff
    cmds:
      - ruff format src/ tests/

  test:
    desc: "Run unit tests across all engine domains"
    env:
      PYTHONPATH: src
    cmds:
      - python3 -m unittest discover -s tests -p "test_*.py" -v

  build:
    desc: Build Python wheel artifact for Databricks deployment
    cmds:
      - python3 -c "import shutil; shutil.rmtree('dist', ignore_errors=True); shutil.rmtree('build', ignore_errors=True)"
      - python3 -m pip install --quiet build
      - python3 -m build --wheel
      - ls -lh dist/

  tf:init:
    desc: Initialize Terraform
    dir: terraform
    cmds:
      - terraform init

  tf:plan:
    desc: "Terraform plan (Usage: task tf:plan ENV=dev)"
    dir: terraform
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - terraform plan -var-file="env_conf/{{.ENV}}.tfvars"

  tf:apply:
    desc: "Terraform apply (Usage: task tf:apply ENV=dev)"
    dir: terraform
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - terraform apply -var-file="env_conf/{{.ENV}}.tfvars"

  genie:export:
    desc: Export Databricks Genie Space instructions and Unity Catalog constraint DDLs
    cmds:
      - python3 -m lakehouse_engine.cli export-genie --configs-dir configs/examples --output-file genie_space_instructions.md

  backfill:
    desc: "Run historical batch backfill (Usage: task backfill CONFIG=configs/examples/subscriptions.yml START=2026-01-01 END=2026-03-31)"
    cmds:
      - python3 -m lakehouse_engine.cli backfill --config-path {{.CONFIG}} {{if .START}}--start-date {{.START}}{{end}} {{if .END}}--end-date {{.END}}{{end}}

  mcp:serve:
    desc: Start Model Context Protocol (MCP) server for AI coding and data modeling agents
    cmds:
      - python3 -m lakehouse_engine.cli mcp-serve

  dlq:triage:
    desc: "Autonomous DLQ Triage: Diagnose quarantined records and suggest self-healing patches (Usage: task dlq:triage CONFIG=configs/examples/subscriptions.yml [SAMPLE=configs/examples/sample_dlq_records.json])"
    cmds:
      - python3 -m lakehouse_engine.cli triage-dlq --config-path {{.CONFIG | default "configs/examples/subscriptions.yml"}} {{if .SAMPLE}}--sample-file {{.SAMPLE}}{{end}}

  schema:export:
    desc: Export JSON Schema for IDE autocompletion
    cmds:
      - python3 -m lakehouse_engine.cli export-schema

  scaffold:
    desc: "Scaffold a new entity YAML from sample JSON (Usage: task scaffold NAME=orders TABLE=raw_landing.orders SAMPLE=sample.json)"
    cmds:
      - python3 -m lakehouse_engine.cli scaffold --entity-name {{.NAME | default "sample_entity"}} --source-table {{.TABLE | default "raw_landing.sample_events"}} --sample-file {{.SAMPLE | default "configs/examples/sample_dlq_records.json"}}

  config:lint:
    desc: "Lint pipeline YAML configs against production safety guardrails (Usage: task config:lint [TARGET=configs])"
    cmds:
      - python3 -m lakehouse_engine.cli lint-config {{.TARGET | default "configs"}} --strict

  delta:maintain:
    desc: "Run Delta Lake storage maintenance (OPTIMIZE with Liquid Clustering + VACUUM) (Usage: task delta:maintain CONFIG=configs/examples/subscriptions.yml [HOURS=168])"
    cmds:
      - python3 -m lakehouse_engine.cli maintain --config-path {{.CONFIG | default "configs/examples/subscriptions.yml"}} --retention-hours {{.HOURS | default 168}}
