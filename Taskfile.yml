version: '3'

tasks:
  install:
    desc: Install Python dependencies
    cmds:
      - pip install -e ".[dev]"

  lint:
    desc: Run linting and static analysis
    cmds:
      - ruff check src/ tests/
      - mypy src/

  format:
    desc: Format code with ruff
    cmds:
      - ruff format src/ tests/

  test:
    desc: Run unit tests with pytest
    cmds:
      - pytest tests/ -v

  build:
    desc: Build Python wheel artifact for Databricks deployment
    cmds:
      - python -m pip install build
      - python -m build --wheel
      - ls -lh dist/

  tf:init:
    desc: Initialize Terraform
    dir: terraform
    cmds:
      - terraform init

  tf:plan:
    desc: Terraform plan (Usage: task tf:plan ENV=dev)
    dir: terraform
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - terraform plan -var-file="env_conf/{{.ENV}}.tfvars"

  tf:apply:
    desc: Terraform apply (Usage: task tf:apply ENV=dev)
    dir: terraform
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      - terraform apply -var-file="env_conf/{{.ENV}}.tfvars"

  genie:export:
    desc: Export Databricks Genie Space instructions and Unity Catalog constraint DDLs
    cmds:
      - python3 -m lakehouse_engine.cli export-genie --configs-dir configs/examples --output-file genie_space_instructions.md

  backfill:
    desc: "Run historical batch backfill (Usage: task backfill CONFIG=configs/examples/subscriptions.yml START=2026-01-01 END=2026-03-31)"
    cmds:
      - python3 -m lakehouse_engine.cli backfill --config-path {{.CONFIG}} {{if .START}}--start-date {{.START}}{{end}} {{if .END}}--end-date {{.END}}{{end}}

  mcp:serve:
    desc: Start Model Context Protocol (MCP) server for AI coding and data modeling agents
    cmds:
      - python3 -m lakehouse_engine.cli mcp-serve
